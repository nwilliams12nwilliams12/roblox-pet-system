name: Nex RDP

on:
  workflow_dispatch:
    inputs:
      phone_ip:
        description: Optional fallback Phone Tailscale IP
        required: false
        default: ""
        type: string
      download_roblox:
        description: Download Roblox Studio on Desktop
        required: false
        default: true
        type: boolean

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Verify Secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAILSCALE_AUTH_KEY }}")) {
            Write-Error "TAILSCALE_AUTH_KEY secret is missing!"
            exit 1
          }
          $phoneIp = "${{ secrets.PHONE_TAILSCALE_IP }}"
          if ([string]::IsNullOrWhiteSpace($phoneIp)) {
            $phoneIp = "${{ inputs.phone_ip }}"
          }
          if (-not [string]::IsNullOrWhiteSpace($phoneIp)) {
            Write-Host "::add-mask::$phoneIp"
            "LOCKED_PHONE_IP=$phoneIp" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Configure Phone-Only Locked RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall set rule group="remote desktop" new enable=No 2>$null
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall delete rule name="RDP-Phone-Only" 2>$null
          if (-not [string]::IsNullOrWhiteSpace($env:LOCKED_PHONE_IP)) {
            netsh advfirewall firewall add rule name="RDP-Phone-Only" dir=in action=allow protocol=TCP localport=3389 remoteip=$env:LOCKED_PHONE_IP | Out-Null
            Write-Host "Firewall locked: ONLY your phone IP can connect to RDP."
          } else {
            netsh advfirewall firewall add rule name="RDP-Phone-Only" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          }
          Restart-Service -Name TermService -Force

      - name: Create Encrypted RDP User
        shell: pwsh
        run: |
          $fixedPass = "${{ secrets.RDP_FIXED_PASSWORD }}"
          if (-not [string]::IsNullOrWhiteSpace($fixedPass)) {
            $password = $fixedPass
          } else {
            $upper = [char[]](65..90)
            $lower = [char[]](97..122)
            $nums = [char[]](48..57)
            $syms = @('@', '#', '!', '%', '-', '_')
            $chars = @()
            $chars += $upper | Get-Random -Count 4
            $chars += $lower | Get-Random -Count 5
            $chars += $nums | Get-Random -Count 4
            $chars += $syms | Get-Random -Count 3
            $password = -join ($chars | Sort-Object { Get-Random })
          }
          Write-Host "::add-mask::$password"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install & Connect Tailscale
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $msi -TimeoutSec 60
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait
          Remove-Item $msi -Force
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="nex-rdp-$env:GITHUB_RUN_ID" --unattended
          $tsIP = $null
          for ($i = 0; $i -lt 15; $i++) {
            $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null | Select-Object -First 1)
            if ($tsIP -and $tsIP.StartsWith("100.")) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned. Make sure TAILSCALE_AUTH_KEY is Reusable and valid."
            exit 1
          }
          Write-Host "::add-mask::$tsIP"
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare Roblox Studio Installer
        if: ${{ inputs.download_roblox != false }}
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $desk = "C:\Users\Public\Desktop"
          $plugins = "C:\Users\RDP\AppData\Local\Roblox\Plugins"
          New-Item -ItemType Directory -Force -Path $desk | Out-Null
          New-Item -ItemType Directory -Force -Path $plugins | Out-Null
          try {
            Invoke-WebRequest -Uri "https://setup.rbxcdn.com/RobloxStudioInstaller.exe" -OutFile "$desk\RobloxStudioInstaller.exe" -TimeoutSec 35
            Write-Host "Roblox Studio installer ready on Desktop."
          } catch {
            Write-Host "Skipped Roblox download."
          }

      - name: Push Session Privately Over Tailscale
        shell: pwsh
        run: |
          $phoneIp = $env:LOCKED_PHONE_IP
          $startedMs = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $payload = @{
            ip = $env:TAILSCALE_IP
            user = "RDP"
            password = $env:RDP_PASSWORD
            runId = $env:GITHUB_RUN_ID
            startedAt = $startedMs
            status = "online"
            locked = (-not [string]::IsNullOrWhiteSpace($phoneIp))
          } | ConvertTo-Json -Compress

          $listener = $null
          try {
            netsh advfirewall firewall delete rule name="NexRDP-Pull" 2>$null
            if (-not [string]::IsNullOrWhiteSpace($phoneIp)) {
              netsh advfirewall firewall add rule name="NexRDP-Pull" dir=in action=allow protocol=TCP localport=34874 remoteip=$phoneIp | Out-Null
            }
            $listener = New-Object System.Net.HttpListener
            $listener.Prefixes.Add("http://${env:TAILSCALE_IP}:34874/")
            $listener.Start()
          } catch {
            $listener = $null
          }

          $pendingTask = if ($listener) { $listener.GetContextAsync() } else { $null }
          $lastPush = [DateTime]::MinValue
          $pushedOnce = $false

          Write-Host "Runner online and locked to authorized phone."
          while ($true) {
            if ($pendingTask -and $pendingTask.IsCompleted) {
              try {
                $ctx = $pendingTask.Result
                $buf = [System.Text.Encoding]::UTF8.GetBytes($payload)
                $ctx.Response.StatusCode = 200
                $ctx.Response.ContentType = "application/json"
                $ctx.Response.ContentLength64 = $buf.Length
                $ctx.Response.OutputStream.Write($buf, 0, $buf.Length)
                $ctx.Response.OutputStream.Close()
              } catch {}
              $pendingTask = $listener.GetContextAsync()
            }

            if (([DateTime]::UtcNow - $lastPush).TotalSeconds -ge 10) {
              $lastPush = [DateTime]::UtcNow
              if (-not [string]::IsNullOrWhiteSpace($phoneIp)) {
                try {
                  Invoke-RestMethod -Uri "http://${phoneIp}:34873/api/rdp-session" -Method Post -ContentType "application/json" -Body $payload -TimeoutSec 5 | Out-Null
                  if (-not $pushedOnce) {
                    Write-Host "Private Tailscale handshake completed."
                    $pushedOnce = $true
                  }
                } catch {}
                try {
                  Invoke-RestMethod -Uri "http://${phoneIp}:34872/api/rdp-info" -Method Post -ContentType "application/json" -Body $payload -TimeoutSec 3 | Out-Null
                } catch {}
              }
            }
            Start-Sleep -Milliseconds 500
          }
